[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-protocol"
version = "0.1.0"
description = "Shared WebSocket message schema for pi_agent and desktop_app"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
]

[tool.setuptools.packages.find]
where = ["src"]
